*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent;background:#050510}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#050510;color:#e0e0e0;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
#particleMap{position:fixed;top:0;left:0;width:100%;height:45vh;z-index:0}
.overlay{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,#050510 80%);height:120px;pointer-events:none;z-index:1}
.counter-bar{position:absolute;bottom:1rem;left:50%;transform:translateX(-50%);z-index:2;display:flex;align-items:center;gap:0.6rem;background:rgba(10,10,20,0.8);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.1);border-radius:50px;padding:0.5rem 1.2rem;pointer-events:none}
.counter-bar .icon{font-size:1.2rem}
.counter-bar .count{font-size:1.3rem;font-weight:900;background:linear-gradient(135deg,#75aadb,#ffd700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.counter-bar .label{font-size:0.75rem;color:#aaa}
.content{position:relative;z-index:3;margin-top:45vh;background:linear-gradient(180deg,transparent 0%,#050510 60px,#050510 100%);min-height:55vh}
.hero{text-align:center;padding:2rem 1rem 1.5rem}
.hero-flag{font-size:3rem;animation:wave 2s ease-in-out infinite;display:inline-block}
@keyframes wave{0%,100%{transform:rotate(0)}25%{transform:rotate(4deg)}75%{transform:rotate(-4deg)}}
.hero h1{font-size:clamp(1.5rem,5vw,2.2rem);font-weight:900;background:linear-gradient(135deg,#fff,#75aadb);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero .sub{font-size:0.9rem;color:#667;margin-top:0.2rem}
.hero .badge{display:inline-block;margin-top:0.8rem;background:rgba(117,170,219,0.12);color:#75aadb;padding:0.3rem 1rem;border-radius:50px;font-size:0.8rem;font-weight:700;border:1px solid rgba(117,170,219,0.15)}
.song-list{max-width:600px;margin:0 auto;padding:0 1rem 2rem;display:flex;flex-direction:column;gap:0.5rem}
.song-card{background:rgba(255,255,255,0.03);border:1px solid rgba(117,170,219,0.1);border-radius:14px;overflow:hidden;transition:all 0.2s}
.song-card:active{transform:scale(0.985)}
.song-header{display:flex;align-items:center;gap:0.7rem;padding:0.9rem 1rem;cursor:pointer;user-select:none;-webkit-user-select:none}
.song-header .num{width:1.8rem;height:1.8rem;border-radius:50%;background:linear-gradient(135deg,#75aadb,#5a8fc7);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:0.8rem;color:#fff;flex-shrink:0}
.song-header .info{flex:1;min-width:0}
.song-header .title{font-weight:700;font-size:0.95rem;color:#e8e8f0}
.song-header .hint{font-size:0.72rem;color:#556;margin-top:0.1rem}
.song-header .arrow{color:#75aadb;transition:transform 0.3s;flex-shrink:0}
.song-card.open .arrow{transform:rotate(180deg)}
.song-lyrics{max-height:0;overflow:hidden;transition:max-height 0.4s ease,padding 0.3s ease;background:rgba(117,170,219,0.03);border-top:1px solid rgba(117,170,219,0.08)}
.song-card.open .song-lyrics{max-height:2000px;padding:1rem}
.lyrics-text{font-size:1rem;line-height:1.9;white-space:pre-line;color:#c8ccd4}
.lyrics-text em{color:#ffd700;font-style:normal;font-weight:700;font-size:1.05rem}
.share-bar{text-align:center;padding:1rem 1rem 3rem;max-width:600px;margin:0 auto}
.btn-share{display:inline-flex;align-items:center;gap:0.5rem;background:#25D366;color:#fff;border:none;padding:0.8rem 1.8rem;border-radius:50px;font-size:1rem;font-weight:700;cursor:pointer;box-shadow:0 4px 20px rgba(37,211,102,0.25);transition:transform 0.2s}
.btn-share:active{transform:scale(0.95)}
.footer{text-align:center;padding:0 1rem 2rem;font-size:0.75rem;color:#444}
.footer span{color:#75aadb}
@media(min-width:768px){#particleMap{height:55vh}.content{margin-top:55vh}}
</style>

(function() {

  var container = canvas.parentElement;

  function resize() {
    var rect = container.getBoundingClientRect();
    canvas.width = rect.width * (window.devicePixelRatio || 1);
    canvas.height = rect.height * (window.devicePixelRatio || 1);
    ctx.setTransform(1, 0, 0, 1, 0, 0);

    var lat = lat10 / 10;
    var w = canvas.width / (window.devicePixelRatio || 1);
    var h = canvas.height / (window.devicePixelRatio || 1);
    // Equirectangular projection

    return [x, y];

      ctx.beginPath();
      ctx.arc(uxy[0], uxy[1], ringR, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(117,170,219,' + Math.max(0, ringAlpha) + ')';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Glow
      var uGlow = ctx.createRadialGradient(uxy[0], uxy[1], 0, uxy[0], uxy[1], 10);
      uGlow.addColorStop(0, 'rgba(117,170,219,0.9)');
      uGlow.addColorStop(0.5, 'rgba(117,170,219,0.3)');
      uGlow.addColorStop(1, 'rgba(117,170,219,0)');

      ctx.beginPath();
      ctx.arc(uxy[0], uxy[1], 10, 0, Math.PI * 2);
      ctx.fillStyle = uGlow;
      ctx.fill();

      // Core
      ctx.beginPath();
      ctx.arc(uxy[0], uxy[1], 3.5, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();
    }

    // Slow horizontal pan to show whole map
    // (shift viewport slightly over time)
    requestAnimationFrame(draw);
  }

  draw();

  // Resize handler updates positions
  window.addEventListener('resize', function() {
    for (var i = 0; i < staticPoints.length; i++) {
      var xy = lonLatToXY(worldPoints[i][0], worldPoints[i][1]);
      staticPoints[i].x = xy[0];
      staticPoints[i].y = xy[1];
      staticPoints[i].baseX = xy[0];
      staticPoints[i].baseY = xy[1];
    }
  });
})();
