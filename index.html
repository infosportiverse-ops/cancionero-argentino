<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🏆 Cancionero Argentino · Cuartos 2026 🇦🇷</title>
<meta name="description" content="Cancionero para la hinchada argentina. Letras para cantar todos juntos. ¡Vamos Argentina!">
<meta name="theme-color" content="#75aadb">
<meta property="og:title" content="Cancionero Argentino · Cuartos 2026">
<meta property="og:description" content="Todas las letras para cantar. ¡Vamos Argentina! 🇦🇷">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cancionero ARG">
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://d3js.org/topojson.v3.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent;background:#0a0a14}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  background:#0a0a14;
  color:#e0e0e0;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

/* === GLOBE === */
#globeContainer{
  position:fixed;top:0;left:0;width:100%;height:45vh;
  z-index:0;overflow:hidden;
  background:radial-gradient(circle at 50% 35%,#151530 0%,#0a0a14 70%);
}
#globeContainer svg{display:block;width:100%;height:100%}
#globeContainer .graticule{fill:none;stroke:rgba(117,170,219,0.06);stroke-width:0.5}
#globeContainer .land{fill:rgba(117,170,219,0.18);stroke:rgba(117,170,219,0.25);stroke-width:0.5}
#globeContainer .land-arg{fill:rgba(255,215,0,0.25);stroke:rgba(255,215,0,0.4);stroke-width:0.5}
#globeContainer .dot{fill:#ffd700;opacity:0.9}
#globeContainer .dot-user{fill:#75aadb;opacity:1}
#globeContainer .pulse{fill:none;stroke:#75aadb;stroke-width:1.5;opacity:0.7}

.globe-overlay{
  position:absolute;bottom:0;left:0;right:0;
  background:linear-gradient(transparent,#0a0a14 80%);
  height:120px;pointer-events:none;z-index:1;
}
.counter-bar{
  position:absolute;bottom:1rem;left:50%;transform:translateX(-50%);
  z-index:2;
  display:flex;align-items:center;gap:0.6rem;
  background:rgba(10,10,20,0.8);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:50px;
  padding:0.5rem 1.2rem;
  pointer-events:none;
}
.counter-bar .icon{font-size:1.2rem}
.counter-bar .count{
  font-size:1.3rem;font-weight:900;
  background:linear-gradient(135deg,#75aadb,#ffd700);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.counter-bar .label{font-size:0.75rem;color:#aaa}

.content{
  position:relative;z-index:3;
  margin-top:45vh;
  background:linear-gradient(180deg,transparent 0%,#0a0a14 60px,#0a0a14 100%);
  min-height:55vh;
}

.hero{
  text-align:center;padding:2rem 1rem 1.5rem;
}
.hero-flag{font-size:3rem;animation:wave 2s ease-in-out infinite;display:inline-block}
@keyframes wave{0%,100%{transform:rotate(0)}25%{transform:rotate(4deg)}75%{transform:rotate(-4deg)}}
.hero h1{
  font-size:clamp(1.5rem,5vw,2.2rem);font-weight:900;
  background:linear-gradient(135deg,#fff,#75aadb);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.hero .sub{font-size:0.9rem;color:#8899aa;margin-top:0.2rem}
.hero .badge{
  display:inline-block;margin-top:0.8rem;
  background:rgba(117,170,219,0.15);color:#75aadb;
  padding:0.3rem 1rem;border-radius:50px;font-size:0.8rem;font-weight:700;
  border:1px solid rgba(117,170,219,0.2);
}

.song-list{
  max-width:600px;margin:0 auto;padding:0 1rem 2rem;
  display:flex;flex-direction:column;gap:0.5rem;
}
.song-card{
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(117,170,219,0.15);
  border-radius:14px;overflow:hidden;
  transition:all 0.2s;
}
.song-card:active{transform:scale(0.985)}
.song-header{
  display:flex;align-items:center;gap:0.7rem;
  padding:0.9rem 1rem;cursor:pointer;
  user-select:none;-webkit-user-select:none;
}
.song-header .num{
  width:1.8rem;height:1.8rem;border-radius:50%;
  background:linear-gradient(135deg,#75aadb,#5a8fc7);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:0.8rem;color:#fff;flex-shrink:0;
}
.song-header .info{flex:1;min-width:0}
.song-header .title{font-weight:700;font-size:0.95rem;color:#e8e8f0}
.song-header .hint{font-size:0.72rem;color:#667;margin-top:0.1rem}
.song-header .arrow{color:#75aadb;transition:transform 0.3s;flex-shrink:0}
.song-card.open .arrow{transform:rotate(180deg)}

.song-lyrics{
  max-height:0;overflow:hidden;
  transition:max-height 0.4s ease,padding 0.3s ease;
  background:rgba(117,170,219,0.04);
  border-top:1px solid rgba(117,170,219,0.1);
}
.song-card.open .song-lyrics{max-height:2000px;padding:1rem}

.lyrics-text{
  font-size:1rem;line-height:1.9;white-space:pre-line;
  color:#c8ccd4;
}
.lyrics-text em{
  color:#ffd700;font-style:normal;font-weight:700;
  font-size:1.05rem;
}

.share-bar{text-align:center;padding:1rem 1rem 3rem;max-width:600px;margin:0 auto}
.btn-share{
  display:inline-flex;align-items:center;gap:0.5rem;
  background:#25D366;color:#fff;border:none;
  padding:0.8rem 1.8rem;border-radius:50px;
  font-size:1rem;font-weight:700;cursor:pointer;
  box-shadow:0 4px 20px rgba(37,211,102,0.25);
  transition:transform 0.2s;text-decoration:none;
}
.btn-share:active{transform:scale(0.95)}

.footer{text-align:center;padding:0 1rem 2rem;font-size:0.75rem;color:#555}
.footer span{color:#75aadb}

@media(min-width:768px){#globeContainer{height:55vh}.content{margin-top:55vh}}
</style>
</head>
<body>

<div id="globeContainer">
  <div class="globe-overlay"></div>
  <div class="counter-bar">
    <span class="icon">🌍</span>
    <span class="count" id="counter">...</span>
    <span class="label">hinchas alentando</span>
  </div>
</div>

<div class="content">
  <div class="hero">
    <div class="hero-flag">🇦🇷</div>
    <h1>Cancionero Argentino</h1>
    <p class="sub">Cuartos de Final · Copa del Mundo 2026</p>
    <div class="badge">🎵 15 canciones</div>
  </div>
  <div class="song-list" id="songList"></div>
  <div class="share-bar">
    <button class="btn-share" onclick="share()">📤 Compartir cancionero</button>
  </div>
  <div class="footer">
    Hecho con ❤️ por <span>@SportLevels</span> · ¡Vamos Argentina!
  </div>
</div>

<script>
// ============================================================
//  GLOBO D3 — proyección orthográfica, nítido, vectorial
// ============================================================
(async function() {
  const container = document.getElementById('globeContainer');
  const width = container.clientWidth;
  const height = container.clientHeight;

  const svg = d3.select('#globeContainer').append('svg')
    .attr('viewBox', [0, 0, width, height]);

  const g = svg.append('g');

  const projection = d3.geoOrthographic()
    .scale(Math.min(width, height) * 0.42)
    .translate([width / 2, height / 2 + 10])
    .clipAngle(90);

  const path = d3.geoPath(projection);

  // Graticule
  const graticule = d3.geoGraticule10();

  // Rotación automática
  let rotation = [0, -10];
  let autoRotate = true;
  let dragStart;

  function updateGlobe() {
    projection.rotate(rotation);
    g.selectAll('path.graticule').attr('d', path);
    g.selectAll('path.land').attr('d', path);
    g.selectAll('path.land-arg').attr('d', path);
    g.selectAll('circle.dot').attr('transform', d => {
      const coords = projection([d.lng, d.lat]);
      return coords ? `translate(${coords[0]},${coords[1]})` : 'translate(-999,-999)';
    });
    g.selectAll('circle.dot-user').attr('transform', () => {
      const coords = projection([userLng, userLat]);
      return coords ? `translate(${coords[0]},${coords[1]})` : 'translate(-999,-999)';
    });
    g.selectAll('circle.pulse').attr('transform', () => {
      const coords = projection([userLng, userLat]);
      return coords ? `translate(${coords[0]},${coords[1]})` : 'translate(-999,-999)';
    });
  }

  // Drag
  const drag = d3.drag()
    .on('start', (event) => {
      autoRotate = false;
      dragStart = [event.x, event.y];
    })
    .on('drag', (event) => {
      const dx = event.x - dragStart[0];
      const dy = event.y - dragStart[1];
      const sensitivity = 75;
      const gr = projection.rotate();
      rotation = [
        gr[0] + dx / (width / 2) * sensitivity,
        gr[1] - dy / (height / 2) * sensitivity
      ];
      if (rotation[1] > 90) rotation[1] = 90;
      if (rotation[1] < -90) rotation[1] = -90;
      dragStart = [event.x, event.y];
      updateGlobe();
    })
    .on('end', () => {
      // Resume rotation after 3s idle
      setTimeout(() => { autoRotate = true; }, 3000);
    });

  svg.call(drag);

  // Load world map
  let world, countries;
  try {
    world = await d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json');
    countries = topojson.feature(world, world.objects.countries);
  } catch(e) {
    console.error('Error cargando mapa:', e);
    // Fallback: usar countries-50m (más liviano)
    try {
      world = await d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json');
      countries = topojson.feature(world, world.objects.countries);
    } catch(e2) {
      console.error('Error cargando mapa fallback:', e2);
      return; // Sin mapa no seguimos
    }
  }

  // Graticule lines
  g.selectAll('path.graticule').data([graticule()])
    .join('path').attr('class','graticule').attr('d', path);

  // Land masses
  g.selectAll('path.land').data(countries.features)
    .join('path')
    .attr('class', d => d.id === '032' ? 'land-arg' : 'land')
    .attr('d', path);

  // Geoposicionamiento
  let userLat = -34.6, userLng = -58.4, userCity = 'Argentina';
  try {
    const resp = await fetch('https://ipapi.co/json/');
    const geo = await resp.json();
    if (geo.latitude && geo.longitude) {
      userLat = geo.latitude;
      userLng = geo.longitude;
      userCity = geo.city || geo.country_name || 'hincha';
    }
  } catch(e) {}

  // Dots de hinchas
  const dots = [
    { lat: -34.6, lng: -58.4, r: 4, label: 'Buenos Aires' },
    { lat: -31.4, lng: -64.2, r: 3, label: 'Córdoba' },
    { lat: -32.9, lng: -60.7, r: 3, label: 'Rosario' },
    { lat: 40.7, lng: -74.0, r: 3.5, label: 'Nueva York' },
    { lat: -23.5, lng: -46.6, r: 3.5, label: 'São Paulo' },
    { lat: 34.0, lng: -118.2, r: 3, label: 'Los Ángeles' },
    { lat: 51.5, lng: -0.1, r: 3, label: 'Londres' },
    { lat: 48.8, lng: 2.3, r: 3, label: 'París' },
    { lat: -33.8, lng: 151.2, r: 3, label: 'Sídney' },
    { lat: -36.8, lng: 174.7, r: 2.5, label: 'Auckland' },
    { lat: 19.4, lng: -99.1, r: 3, label: 'CDMX' },
    { lat: 4.7, lng: -74.0, r: 2.5, label: 'Bogotá' },
    { lat: 35.7, lng: 139.7, r: 2.5, label: 'Tokio' },
    { lat: 55.7, lng: 12.5, r: 2, label: 'Copenhague' },
    { lat: -37.8, lng: 144.9, r: 2.5, label: 'Melbourne' },
    { lat: 52.5, lng: 13.4, r: 2, label: 'Berlín' },
    { lat: -41.2, lng: 174.7, r: 2, label: 'Wellington' },
    { lat: -34.9, lng: -56.1, r: 2.5, label: 'Montevideo' },
    { lat: -25.2, lng: -57.5, r: 2, label: 'Asunción' },
    { lat: -12.0, lng: -77.0, r: 2, label: 'Lima' },
    { lat: 25.2, lng: 55.2, r: 2.5, label: 'Dubái' },
    { lat: 1.3, lng: 103.8, r: 2, label: 'Singapur' },
    { lat: 45.4, lng: -75.6, r: 2, label: 'Ottawa' },
    { lat: -26.2, lng: 28.0, r: 2, label: 'Johannesburgo' },
    { lat: -33.4, lng: -70.6, r: 2.5, label: 'Santiago' },
    { lat: 41.3, lng: 2.1, r: 2.5, label: 'Barcelona' },
    { lat: 40.4, lng: -3.7, r: 3, label: 'Madrid' },
    { lat: 38.9, lng: -77.0, r: 2, label: 'Washington' },
    { lat: 43.6, lng: -79.6, r: 2, label: 'Toronto' },
    { lat: -22.9, lng: -43.1, r: 2.5, label: 'Río de Janeiro' },
  ];

  // Dots
  g.selectAll('circle.dot').data(dots)
    .join('circle')
    .attr('class','dot')
    .attr('r', d => d.r)
    .attr('transform', d => {
      const c = projection([d.lng, d.lat]);
      return c ? `translate(${c[0]},${c[1]})` : 'translate(-999,-999)';
    })
    .append('title').text(d => d.label + ' 🇦🇷');

  // User dot + ring
  g.append('circle')
    .attr('class','dot-user')
    .attr('r', 5)
    .attr('transform', () => {
      const c = projection([userLng, userLat]);
      return c ? `translate(${c[0]},${c[1]})` : 'translate(-999,-999)';
    });

  g.append('circle')
    .attr('class','pulse')
    .attr('r', 6)
    .attr('transform', () => {
      const c = projection([userLng, userLat]);
      return c ? `translate(${c[0]},${c[1]})` : 'translate(-999,-999)';
    });

  // Pulse animation
  let pulseR = 6;
  function animatePulse() {
    pulseR += 0.15;
    if (pulseR > 20) pulseR = 6;
    g.select('circle.pulse')
      .attr('r', pulseR)
      .attr('opacity', 1 - (pulseR - 6) / 14);
    requestAnimationFrame(animatePulse);
  }
  animatePulse();

  // Auto-rotate
  d3.timer(() => {
    if (!autoRotate) return;
    rotation[0] += 0.15;
    updateGlobe();
  });

  // Initial render
  updateGlobe();

  // Resize
  window.addEventListener('resize', () => {
    const w = container.clientWidth;
    const h = container.clientHeight;
    projection.scale(Math.min(w, h) * 0.42).translate([w / 2, h / 2 + 10]);
    updateGlobe();
  });

})();

// ============================================================
//  COUNTER (independiente del globo)
// ============================================================
(async function() {
  const counterEl = document.getElementById('counter');
  try {
    const resp = await fetch('https://api.countapi.xyz/hit/cancionero-arg/visitors');
    const data = await resp.json();
    counterEl.textContent = (data.value + 1000).toLocaleString('es-AR');
  } catch(e) {
    counterEl.textContent = '1.847';
  }
})();

// ============================================================
//  CANCIONERO
// ============================================================
const songs = [
  {title:"Muchachos, ahora nos volvimos a ilusionar",hint:"La más popular · Mundial 2022",
   lyrics:`🎵 En Argentina nací\nTierra de Diego y Lionel\nDe los pibes de Malvinas\nQue jamás olvidaré\n\nNo te lo puedo explicar\nPorque no vas a entender\nLas finales que perdimos\nCuantos años las lloré\n\nPero eso se terminó\nPorque en el Maracaná\nLa final con los brazucas\nLa volvió a ganar papá\n\n<em>Muchachos, ahora nos volvimos a ilusionar\nQuiero ganar la cuarta\nQuiero ser campeón mundial\nY al Diego, en el cielo lo podemos ver\nCon Don Diego y con La Tota\nAlentándolo a Lionel</em>\n\nY ser campeones otra vez\nY ser campeones otra vez 🎵`},
  {title:"Vamos, vamos Argentina",hint:"Clásico de la hinchada",
   lyrics:`🎵 Vamos, vamos Argentina\nVamos, vamos a ganar\nQue esta banda quilombera\nNo te deja, no te deja de alentar\n\nVamos, vamos Argentina\nVamos, vamos a ganar\nQue esta banda quilombera\nNo te deja, no te deja de alentar 🎵`},
  {title:"Brasil, decime qué se siente",hint:"Para el clásico eterno",
   lyrics:`🎵 Brasil, decime qué se siente\nTener en casa a tu papá\nTe juro que aunque pasen los años\nNunca nos vamos a olvidar\n\nQue el Diego te gambeteó\nY el Cani te vacunó\nY el Messi te demostró\nQue el fútbol es de Argentina\n\nBrasil, decime qué se siente... 🎵`},
  {title:"El que no salta...",hint:"Clásico del estadio",
   lyrics:`🎵 El que no salta, el que no salta\nEs un inglés, es un inglés\n\nEl que no salta, el que no salta\nEs un inglés, es un inglés\n\n(Saltar todos juntos arriba y abajo) 🎵`},
  {title:"Vengo del barrio",hint:"Para cantar bien fuerte",
   lyrics:`🎵 Vengo del barrio, del barrio vengo\nA todos lados yo te vengo a ver\nAunque no salgas nunca campeón\nIgual te quiero, sos mi pasión\n\nVengo del barrio, del barrio vengo\nA todos lados yo te vengo a ver\nAunque no salgas nunca campeón\nIgual te quiero, sos mi pasión 🎵`},
  {title:"Yo te aliento de la cuna al cajón",hint:"Amor incondicional",
   lyrics:`🎵 Yo te aliento de la cuna al cajón\nYo te sigo a todos lados\nPorque es grande este amor\nNo me importa si jugás bien o mal\nYo te quiero igual\nArgentina es mi pasión\n\nYo te aliento de la cuna al cajón\nYo te sigo a todos lados\nPorque es grande este amor 🎵`},
  {title:"Soy argentino, es un sentimiento",hint:"Identidad",
   lyrics:`🎵 Soy argentino, es un sentimiento\nNo puedo parar, no puedo parar\nSoy argentino, es un sentimiento\nNo puedo parar de alentar 🎵`},
  {title:"Esta noche hay que ganar",hint:"Previa del partido",
   lyrics:`🎵 Esta noche hay que ganar\nEsta noche hay que ganar\nEs la hinchada la que pide\nQue salgas a ganar\n\nEsta noche hay que ganar\nEsta noche hay que ganar\nEs la hinchada la que pide\nQue salgas a ganar 🎵`},
  {title:"La Scaloneta",hint:"Para el equipo de todos",
   lyrics:`🎵 Y ya lo ve, y ya lo ve\nEs la Scaloneta, es la Scaloneta\nY ya lo ve, y ya lo ve\nEs la Scaloneta, es la Scaloneta\n\nLa que ganó en el Maracaná\nLa que nos hizo campeón de América\nLa que nos dio la tercera estrella\nY ahora va por la cuarta 🎵`},
  {title:"Oh, vamos los pibes",hint:"Furor en Qatar 2022",
   lyrics:`🎵 Oh, vamos los pibes\nVamos a ganar\nQue esta banda\nNo te deja de alentar\n\nOh, vamos los pibes\nPongan más huevos\nQue esta noche\nTenemos que ganar 🎵`},
  {title:"El mundial lo vamos a ganar",hint:"Fe y convicción",
   lyrics:`🎵 El mundial lo vamos a ganar\nEl mundial lo vamos a ganar\nDale Argentina, dale Argentina\nEl mundial lo vamos a ganar\n\nLa copa la vamos a traer\nLa copa la vamos a traer\nDale Argentina, dale Argentina\nLa copa la vamos a traer 🎵`},
  {title:"A esos los borramos del mapa",hint:"Contra cualquiera",
   lyrics:`🎵 A esos los borramos del mapa\nA esos los borramos del mapa\nPorque Argentina es un sentimiento\nY a todos lados te sigo yo\n\nA esos los borramos del mapa\nA esos los borramos del mapa\nPorque Argentina es un sentimiento\nY a todos lados te sigo yo 🎵`},
  {title:"Dale campeón, dale campeón",hint:"Aliento constante",
   lyrics:`🎵 Dale campeón, dale campeón\nDale campeón, dale campeón\n\nQue la vuelta vamos a dar\nQue la vuelta vamos a dar\nDale campeón, dale campeón\nDale campeón, dale campeón 🎵`},
  {title:"Argentina, Argentina, Argentina",hint:"El grito de guerra",
   lyrics:`🎵 Argentina, Argentina, Argentina\nArgentina, Argentina, Argentina\n\nCada día te quiero más\nCada día te quiero más\nArgentina, Argentina, Argentina\nArgentina, Argentina, Argentina 🎵`},
  {title:"Somos locales otra vez",hint:"La hinchada hace la diferencia",
   lyrics:`🎵 Somos locales otra vez\nSomos locales otra vez\nEn cualquier cancha del mundo\nArgentina es local\n\nSomos locales otra vez\nSomos locales otra vez\nNo importa dónde juguemos\nArgentina es local 🎵`}
];

const list = document.getElementById('songList');
songs.forEach((s,i)=>{
  const c=document.createElement('div');
  c.className='song-card';
  c.innerHTML=`<div class="song-header" onclick="this.parentElement.classList.toggle('open')"><div class="num">${i+1}</div><div class="info"><div class="title">${s.title}</div><div class="hint">${s.hint}</div></div><div class="arrow">▾</div></div><div class="song-lyrics"><div class="lyrics-text">${s.lyrics}</div></div>`;
  list.appendChild(c);
});

function share(){
  const t='🏆 Cancionero Argentino · Cuartos 2026 🇦🇷\nTodas las letras para cantar en la cancha:\n'+window.location.href;
  navigator.share?navigator.share({title:'Cancionero Argentino',text:t,url:window.location.href}):window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank');
}
</script>
</body>
</html>
